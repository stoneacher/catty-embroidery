# SwiftLint: current default rules plus Catrobat's non-style rules.
# Baseline reference: Catty src/.swiftlint.yml (an only_rules list predating
# Swift 6/SwiftUI). Its style-only rules are left to SwiftFormat (.swiftformat),
# and its XCTest-, Interface-Builder- and Quick/Nimble-specific rules do not
# apply to this codebase (Swift Testing, SwiftUI), so neither was carried over.

opt_in_rules:
  - contains_over_first_not_nil
  - discarded_notification_center_observer
  - discouraged_optional_boolean
  - empty_count
  - empty_string
  - fatal_error_message
  - function_default_parameter_at_end
  - joined_default_parameter
  - prohibited_super_call
  - sorted_first_last
  - untyped_error_in_catch
  - weak_delegate
  - yoda_condition

identifier_name:
  excluded: # canonical coordinate component and delta names (CGPoint precedent)
    - x
    - y
    - dx
    - dy
    - to # Brick.setVariable(name:to:) — reads "set variable … to …" (Catroid parity)
    - id # Identifiable's required property name — spelled by the protocol, not chosen

custom_rules:
  # US-303's "no hardcoded user-facing strings" check.
  #
  # A lint rule rather than a test, and the reason is structural: app tests run
  # sandboxed in the simulator and cannot read repo sources, so no Swift test can
  # see a literal in a view file. The story allows "a grep-level check"; this is
  # that check, running in the existing CI lint job and locally with no new script.
  #
  # It is a backstop, not the mechanism. The real guarantee is that every string
  # goes through a generated `LocalizedStringResource` symbol, where a typo is a
  # compile error — this only catches someone reintroducing a literal.
  localized_user_facing_strings:
    name: "Hardcoded user-facing string"
    included: ".*/catrobat_embroidery_ios/catrobat_embroidery_ios/.*\\.swift"
    # The name list and the `\s*` before `(` are both from measurement, not
    # imagination: the in-loop review ran a probe file and found `NavigationLink`,
    # `Picker`, `Stepper`, `Menu`, `Link`, `.searchable(prompt:)`, `.help()` and
    # `Text ("…")` (space before the paren) all slipping through. `NavigationLink`
    # is the one US-304 reaches for on its first day.
    # Two branches, because user-facing literals arrive in two shapes: as the
    # first positional argument of a view or modifier, and as a labelled argument
    # such as `searchable(prompt:)`. The first branch needs a paren after the
    # name; the second must not require one, which is why `prompt:` failed to
    # fire when it was folded into the first.
    regex: "(\\b(Text|Label|Button|Toggle|Section|TextField|SecureField|ContentUnavailableView|NavigationLink|Picker|Stepper|Slider|Menu|Link|navigationTitle|navigationBarTitle|accessibilityLabel|accessibilityHint|accessibilityValue|confirmationDialog|alert|help)\\s*\\(\\s*\")|(\\b(prompt|titleKey|titleResource|message|label):\\s*\")"
    excluded_match_kinds:
      - comment
      - doccomment
    message: >-
      User-facing text goes through Localizable.xcstrings as a generated
      LocalizedStringResource symbol, never a literal (Catrobat ships ~75
      languages). Text(verbatim:) is the escape hatch for genuinely
      non-localizable content such as a number already formatted for the locale.
    severity: error

  # The rule above only catches a literal *immediately* after the paren, so
  # `Text(String(localized: "…"))` and `Text(LocalizedStringKey("…"))` slipped
  # through it — found by the cross-vendor review, not by us. Those two are worse
  # than a bare literal, not better: they look like localization APIs while the
  # literal itself becomes the displayed fallback when no catalog entry exists.
  # Matching the constructors directly also catches them across line breaks,
  # which the call-site regex cannot do.
  localized_string_literal_constructors:
    name: "Localization API wrapping a literal"
    included: ".*/catrobat_embroidery_ios/catrobat_embroidery_ios/.*\\.swift"
    regex: "\\b(String\\(localized:|LocalizedStringKey\\(|LocalizedStringResource\\()\\s*\""
    excluded_match_kinds:
      - comment
      - doccomment
    message: >-
      A string literal inside String(localized:) / LocalizedStringKey() /
      LocalizedStringResource() is not localization — it is the fallback that
      ships when the catalog entry is missing. Add the entry to
      Localizable.xcstrings and use the generated symbol instead.
    severity: error

excluded:
  - "**/.build"
  - "**/DerivedData"
  # Agent worktrees (`isolation: "worktree"`) are checkouts *inside* the repo, so
  # SwiftLint walks them and reports violations against a copy — including
  # deleted files that still exist on the agent's branch. Found the first time a
  # reviewer agent ran while the new custom rule was active: it flagged
  # `ContentView.swift`, a file this story deletes.
  - ".claude/worktrees"
