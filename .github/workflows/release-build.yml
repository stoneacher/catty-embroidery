name: Release build

# A compile of the app in the Release configuration — no tests, no signing.
#
# Why it exists: `#if DEBUG` code is invisible to every other gate. The local commit hook
# and `ci.yml` both build Debug, so a Release-only compile error passes all of them. US-405
# shipped exactly that to a PR branch (an unguarded `SampleID.us309Synthetic`, which exists
# only under `#if DEBUG`) and only an in-loop reviewer who happened to build Release found it.
#
# Why its own file rather than a job in `ci.yml`: `ci.yml` runs on every branch push as
# well as on pull requests, and this job is wanted on pull requests and tags only. A job
# skipped with `if:` would still report a "skipped" check of the same name on the same
# commit as the pull-request run — a poor thing to make a required status check. A separate
# workflow with its own triggers reports once per pull-request head, and not at all on a
# plain branch push.
#
# Required status check (ADR-023): CI, not the local hook, is the enforcement boundary.
on:
  pull_request:
  push:
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-release-build:
    name: App Release build (xcodebuild)
    runs-on: macos-26
    # A compile only, so well under the app-test job's 20; a wedged runner fails in a
    # useful time rather than burning the 360-minute default.
    timeout-minutes: 15
    env:
      # Same pin and the same reason as ci.yml: the runner-default Xcode drifts and breaks
      # Swift 6.x builds. Xcode 26.6 (Swift 6.3.3) matches the local development toolchain.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build the app in Release
        # A generic simulator destination, so no device and no simulator boot is needed,
        # and CODE_SIGNING_ALLOWED=NO so the runner needs no identity. -project is explicit
        # for the reason ci.yml gives: the project is nested below the repository root.
        run: |
          xcodebuild build \
            -project catrobat_embroidery_ios/catrobat_embroidery_ios.xcodeproj \
            -scheme catrobat_embroidery_ios \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
